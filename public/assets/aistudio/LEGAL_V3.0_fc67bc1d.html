    function removeVietnameseTones(str) {
      if (!str) return '';
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D');
    }

    function toPascalCaseVN(str, maxLength = 50) {
      if (!str) return 'TrichYeuVanBan';
      const cleanStr = removeVietnameseTones(str)
        .replace(/[^a-zA-Z0-9\s]/g, ' ')
        .trim();
      const pascal = cleanStr
        .split(/\s+/)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
        .join('');
      return pascal.substring(0, maxLength) || 'TrichYeuVanBan';
    }

    function cleanDocNumber(rawNum) {
      if (!rawNum) return '00';
      const firstPart = rawNum.split('/')[0].trim();
      return firstPart.replace(/[^a-zA-Z0-9-]/g, '') || '00';
    }

    function parseVietnameseLegalText(rawText) {
      const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
      const nodes = [];
      let currentNode = null;

      lines.forEach((line, idx) => {
        const isChapter = /^(Chương|CHƯƠNG)\s+[IVXLCDM0-9]+/i.test(line);
        const isSection = /^(Mục|MỤC)\s+[0-9]+/i.test(line);
        const isArticle = /^(Điều|ĐIỀU)\s+[0-9]+[a-z]?[\.:]?/i.test(line);

        if (isChapter || isSection || isArticle) {
          if (currentNode) nodes.push(currentNode);
          const parts = line.split(/[\.:]/);
          const code = parts[0].trim() + (isArticle ? '.' : '');
          const title = parts.slice(1).join('.').trim() || line;
          currentNode = {
            id: 'AUTO-' + (idx + 1),
            level: isChapter ? 'Chương' : isSection ? 'Mục' : 'Điều',
            code: code,
            title: title,
            clauseCount: isArticle ? 3 : 0,
            content: ''
          };
        } else {
          if (!currentNode) {
            currentNode = {
              id: 'AUTO-0',
              level: 'Mở đầu',
              code: 'Căn cứ ban hành · Lời mở đầu',
              title: '',
              clauseCount: 4,
              content: line
            };
          } else {
            currentNode.content += (currentNode.content ? '\n' : '') + line;
          }
        }
      });
      if (currentNode) nodes.push(currentNode);
      return nodes;
    }

    function smartAnalyzeFile3D(fileName, extractedText = '') {
      const extMatch = fileName.match(/\.([a-zA-Z0-9]+)$/);
      const ext = extMatch ? extMatch[1].toLowerCase() : 'pdf';
      const baseName = fileName.replace(/\.[^/.]+$/, '');
      const combinedRaw = `${baseName}\n${extractedText.substring(0, 2500)}`;
      const combinedUpperNoTone = removeVietnameseTones(combinedRaw).toUpperCase();

      // Trục 1: Loại VB & Cơ quan
      let docType = 'ND';
      let issuer = 'CP';
      if (/VAN BAN HOP NHAT|VBHN/.test(combinedUpperNoTone)) { docType = 'VBHN'; issuer = 'BXD'; }
      else if (/NGHI QUYET|\bNQ\b/.test(combinedUpperNoTone)) { docType = 'NQ'; issuer = 'QH'; }
      else if (/NGHI DINH|ND-CP|ND_CP|\bND\b/.test(combinedUpperNoTone)) { docType = 'ND'; issuer = 'CP'; }
      else if (/THONG TU|TT-BXD|\bTT\b/.test(combinedUpperNoTone)) { docType = 'TT'; issuer = 'BXD'; }
      else if (/LUAT|QH15|QH14/.test(combinedUpperNoTone)) { docType = 'LUAT'; issuer = 'QH'; }
      else if (/QCVN|QUY CHUAN/.test(combinedUpperNoTone)) { docType = 'QCVN'; issuer = 'BXD'; }
      else if (/TCVN|TIEU CHUAN/.test(combinedUpperNoTone)) { docType = 'TCVN'; issuer = 'BKHCN'; }
      else if (/BIEN BAN NGHIEM THU|BBNT/.test(combinedUpperNoTone)) { docType = 'BBNT'; issuer = 'TVGS'; }
      else if (/PHU LUC HOP DONG|PLHD/.test(combinedUpperNoTone)) { docType = 'PLHD'; issuer = 'CDT'; }
      else if (/HOP DONG|\bHD\b/.test(combinedUpperNoTone)) { docType = 'HD'; issuer = 'CDT'; }
      else if (/TO TRINH|TTR/.test(combinedUpperNoTone)) { docType = 'TTr'; issuer = 'BQLDA'; }
      else if (/QUYET DINH|\bQD\b/.test(combinedUpperNoTone)) { docType = 'QD'; issuer = 'CDT'; }

      // Trục 2: Nhận diện Loại hình dự án (HTKT, DAN_DUNG, KCN, CCN, FTZ, PPP_BT)
      const projectAxes = new Set();
      if (/KHU CONG NGHIEP|\bKCN\b|KHU KINH TE/.test(combinedUpperNoTone)) projectAxes.add('KCN');
      if (/CUM CONG NGHIEP|\bCCN\b/.test(combinedUpperNoTone)) projectAxes.add('CCN');
      if (/THUONG MAI TU DO|\bFTZ\b|LOGISTICS/.test(combinedUpperNoTone)) projectAxes.add('FTZ');
      if (/PPP|\bBT\b|\bBOT\b|DOI TAC CONG TU/.test(combinedUpperNoTone)) projectAxes.add('PPP_BT');
      if (/HA TANG KY THUAT|GIAO THONG|CAP THOAT NUOC/.test(combinedUpperNoTone)) projectAxes.add('HTKT');
      if (/DAN DUNG|CHUNG CU|KHU DO THI|NHA O/.test(combinedUpperNoTone)) projectAxes.add('DAN_DUNG');
      if (projectAxes.size === 0) {
        ['HTKT', 'DAN_DUNG', 'KCN', 'CCN', 'FTZ', 'PPP_BT'].forEach(p => projectAxes.add(p));
      }

      // Trục 3: Nhận diện Chức năng (QLCL, HDXD, QLHD, QLCP, VLXD, TCVN, QCVN...)
      const domainRules = [
        { code: 'QCVN', weight: 10, keywords: ['QCVN', 'QUY CHUAN KY THUAT'], gates: ['G6', 'G9', 'G12'], qaqc: ['QT-03'] },
        { code: 'TCVN', weight: 9,  keywords: ['TCVN', 'TIEU CHUAN QUOC GIA', 'TIEU CHUAN NGHIEM THU'], gates: ['G12', 'G14'], qaqc: ['QT-03', 'QT-08', 'QT-12'] },
        { code: 'QLCP', weight: 8,  keywords: ['QLCP', 'CHI PHI', 'DU TOAN', 'DINH MUC', 'DON GIA', 'TONG MUC DAU TU'], gates: ['G9', 'G10', 'G14'], qaqc: [] },
        { code: 'QLHD', weight: 8,  keywords: ['QLHD', 'HOP DONG', 'PHU LUC HOP DONG', 'TAM UNG', 'DIEU CHINH GIA', 'PHAT SINH'], gates: ['G11', 'G14'], qaqc: [] },
        { code: 'VLXD', weight: 8,  keywords: ['VLXD', 'VAT LIEU', 'HOP CHUAN', 'HOP QUY', 'THI NGHIEM', 'LAS-XD', 'CO/CQ'], gates: ['G12'], qaqc: ['QT-03'] },
        { code: 'QLCL', weight: 8,  keywords: ['QLCL', 'CHAT LUONG', 'NGHIEM THU', 'NHAT KY THI CONG', 'BAO TRI'], gates: ['G12', 'G14', 'G15'], qaqc: ['QT-01', 'QT-03', 'QT-08', 'QT-12'] },
        { code: 'HDXD', weight: 7,  keywords: ['HDXD', 'HOAT DONG XAY DUNG', 'THAM DINH', 'BAN VE THI CONG', 'GIAY PHEP XAY DUNG', 'KHOI CONG'], gates: ['G0', 'G9', 'G12'], qaqc: ['QT-01'] },
        { code: 'DTH',  weight: 8,  keywords: ['DTH', 'DAU THAU', 'LUA CHON NHA THAU', 'MOI THAU', 'HSMT'], gates: ['G10', 'G11'], qaqc: [] },
        { code: 'TQT',  weight: 8,  keywords: ['TQT', 'QUYET TOAN', 'KIEM TOAN', 'THANH QUYET TOAN'], gates: ['G14', 'G15'], qaqc: [] },
        { code: 'PCCC', weight: 9,  keywords: ['PCCC', 'PHONG CHAY', 'CHUA CHAY'], gates: ['G6', 'G12', 'G15'], qaqc: [] },
        { code: 'DTU',  weight: 8,  keywords: ['CHU TRUONG DAU TU', 'KHU CONG NGHIEP', 'CUM CONG NGHIEP', 'THUONG MAI TU DO', 'PPP'], gates: ['G0', 'G1'], qaqc: [] }
      ];

      let primaryDomain = 'QLCL';
      let secondaryDomains = [];
      let linkedGates = new Set();
      let linkedQAQC = new Set();
      let bestScore = -1;

      domainRules.forEach(rule => {
        let hits = 0;
        rule.keywords.forEach(kw => {
          if (combinedUpperNoTone.includes(kw)) hits += 1;
        });
        if (hits > 0) {
          secondaryDomains.push(rule.code);
          rule.gates.forEach(g => linkedGates.add(g));
          rule.qaqc.forEach(q => linkedQAQC.add(q));
          const score = hits * rule.weight;
          if (score > bestScore) {
            bestScore = score;
            primaryDomain = rule.code;
          }
        }
      });

      if (secondaryDomains.length === 0) {
        secondaryDomains = ['QLCL', 'HDXD'];
        linkedGates.add('G12');
      }

      let rawNumber = '01';
      const numInText = extractedText.match(/Số\s*:\s*([0-9a-zA-Z\-\/]+)/i);
      const numInFile = baseName.match(/(\d{1,4}[\/\-](?:\d{4}[\/\-])?[a-zA-ZĐđ\-]+)|(\b\d{1,4}\b)/);
      if (numInText && numInText[1]) rawNumber = numInText[1].trim();
      else if (numInFile && numInFile[0]) rawNumber = numInFile[0].replace(/-/g, '/');

      let year = '2026';
      const yearMatch = combinedRaw.match(/\b(201[5-9]|202[0-9])\b/);
      if (yearMatch) year = yearMatch[1];

      let rawSummary = baseName
        .replace(/^(XD|BDS|TC|DN)_[A-Z]+_[A-Z]+_[0-9A-Z]+_\d{4}_[A-Z]+_/i, '')
        .replace(/[_-]+/g, ' ')
        .trim();

      return {
        industry: primaryDomain === 'TQT' ? 'TC' : primaryDomain === 'DTU' ? 'BDS' : 'XD',
        docType,
        issuer,
        rawNumber,
        year,
        primaryDomain,
        rawSummary: rawSummary || baseName,
        appendixSuffix: '',
        ext,
        projectAxes: Array.from(projectAxes),
        secondaryDomains: Array.from(new Set([primaryDomain, ...secondaryDomains])),
        linkedGates: Array.from(linkedGates),
        linkedQAQC: Array.from(linkedQAQC)
      };
    }

    async function extractTextFromPdfFile(file) {
      if (!window.pdfjsLib) return '';
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      const maxPages = Math.min(pdf.numPages, 3);
      for (let i = 1; i <= maxPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n';
      }
      return fullText;
    }

    async function extractTextFromDocxFile(file) {
      if (!window.mammoth) return '';
      const arrayBuffer = await file.arrayBuffer();
      const result = await window.mammoth.extractRawText({ arrayBuffer });
      return result.value || '';
    }

          const proposedName = `${suggestion.industry}_${suggestion.docType}_${suggestion.issuer}_${numClean}_${suggestion.year}_${suggestion.primaryDomain}_${summaryPascal}.${suggestion.ext}`;

            rawFile: file,
            originalName: file.name,
            extractedText,
            suggestion,
            proposedName

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

                  contents: [{ parts: [{ text: `${sysPrompt}\n\nYêu cầu phân tích: ${aiPromptInput}` }] }]

                        {isAiRunning ? '⏳ Đang chạy đối soát chéo 3 Trục...' : '⚡ KÍCH HOẠT AI AGENT ĐỐI SOÁT CHÉO & XUẤT PHÁN QUYẾT'}
                      </button>
                    </div>

                    {aiOutputText && (
                      <div className="bg-slate-900 border border-emerald-500/40 rounded-xl p-4 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold uppercase text-emerald-400">
                            📋 Kết quả Phân tích & Đối soát từ AI Agent:
                          </span>
                          <button
                            onClick={() => {
                              navigator.clipboard.writeText(aiOutputText);
                              showToast('Đã copy báo cáo phân tích của AI!');
                            }}
                            className="text-xs bg-slate-800 px-2.5 py-1 rounded text-slate-200 hover:bg-slate-700"
                          >
                            Copy Báo cáo
                          </button>
                        </div>
                        <pre className="p-4 rounded-lg bg-slate-950 border border-slate-800 text-xs font-mono text-slate-200 whitespace-pre-wrap leading-relaxed">
                          {aiOutputText}
                        </pre>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LexPmoApp />);
  </script>
</body>
</html>
